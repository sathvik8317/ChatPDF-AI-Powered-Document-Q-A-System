name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache embedding + reranker models
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('rag.py') }}
          restore-keys: fastembed-

      - run: pip install -r requirements-dev.txt

      # Tests use a fake LLM, so Ollama is not needed here.
      - run: pytest -q
